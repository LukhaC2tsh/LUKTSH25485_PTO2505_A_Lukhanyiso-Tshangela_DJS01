<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJS01 - VANILLA JS PODCAST APP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="left-side-nav">
<!--<a href="https://www.flaticon.com/free-icons/podcast" title="podcast icons">Podcast icons created by Tanah Basah - Flaticon</a>-->
                <img src="assets/icons & logos/podcast-icon.png" id="podcast-icon" alt="icon of podcast app">
                <h2>PODCAST</h2>
            </div>
            <div class="right-side-nav">
                <img src="assets/icons & logos/search-icon.png" id="search-icon" alt="icon of search button">
                <form class="podcast-search hidden" role="search">
                    <label for="search-input">search</label>
                    <input type="input" id="search-input" placeholder="search" aria-label="search podcasts">
                </form>
                <!--<a href="https://www.flaticon.com/free-icons/profile-picture" title="profile picture icons">Profile picture icons created by Flipicon - Flaticon</a>-->
                <img src="assets/icons & logos/profile-icon.png" id="profile-icon" alt="logo of user profile">
            </div>
        </nav>
    </header>




    <section>
        <div id="app-controls" class="filters">
            <form id="form_filter">
                <label for="genre-filter">Filter By: </label>
                <select name="genre" id="genre-filter">
                    <option value="All Genres">All Genres</option>
                    <option value="genre 1">Genre 1</option>
                    <option value="genre 2">Genre 2</option>
                    <option value="genre 3">Genre 3</option>
                    <option value="genre 4">Genre 4</option>
                </select>
                <label for="sort-filter">Sort By</label>
                <select name="sort-by" id="sort-filter">
                    <option value="most popular">Most Popular</option>
                    <option value="recently updated">Recently Updated</option>
                    <option value="newest">Newest</option>
                </select>
            </form>
        </div>
    </section>

    <main id="app-content" class="podcast-grid">
        <div class="container">
            <main class="card-column-main">
            <!-- 1st Columns: Display podcast in column -->
            <div class="column-div" data-status="todo">
                <!-- Podcast container for COLUMN 1 -->
                <div class="podcast-container"></div>
            </div>
            <!-- 2nd Column -->
            <div class="column-div" data-status="doing">
                <!-- Podscast container for COLUMN 2 -->
                <div class="podcast-container"></div>
            </div>
            <!-- 3rd Column -->
            <div class="column-div" data-status="done">
                <!-- Podcast container for COLUMN 3 -->
                <div class="podcast-container"></div>
            </div>
            </main>
        </div>

        <!--PODCAST MODAL-->
        <dialog id="task-modal" class="hidden">
            <div class="modal-header">
                <button type="button" class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <div class="modal-info">
                <img id="podcast-thumbnail" src="" alt="podcast cover" />
                <h3 id="podcast-title"></h3>
                <p id="podcast-desc"></p>
                <div class="genre-buttons"></div>
                <time id="podcast-date"></time>
            </div>
            <div class="episodes">
                <h4>Episodes</h4>
                <div class="list-episodes"></div>
            </div>
        </dialog>

    </main>
</body>
</html>
